<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.card { width: 1280px; height: 400px; display: flex; align-items: center; padding: 0 80px; gap: 64px; }

p { font-size: 30px; color: var(--muted); margin-top: 18px; }

.chip { font-size: 21px; font-weight: 600; padding: 10px 22px; border-radius: 999px; border: 1.5px solid var(--line); background: rgba(255,255,255,.04); }
.chip b { color: var(--amber); }
</style></head><body><div class="card">
<img src="../../../resources/icon.png">
<div>
  <h1><span class="grad">SFTP Neo</span></h1>
  <p>Edit locally. Ship to your server. Never leave VS Code.</p>
  <div class="chips"><span class="chip"><b>●</b> SFTP</span><span class="chip"><b>●</b> FTP</span><span class="chip"><b>●</b> FTPS</span><span class="chip">🔒 OS keychain</span><span class="chip">🛡️ Backups</span></div>
</div></div></body></html>
